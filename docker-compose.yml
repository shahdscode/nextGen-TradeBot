version: "3.9"

# ── NextGen TradeBot — Docker Compose ─────────────────────────────────────────
# Usage:
#   1. cp .env.example .env  →  fill in JWT_SECRET_KEY, NEWSAPI_KEY, etc.
#   2. docker compose up --build
#
# Ports:
#   Backend API   → http://localhost:8000   (FastAPI + Uvicorn)
#   Frontend UI   → http://localhost:80     (Nginx serving production build)
#   Redis         → localhost:6379          (internal, not exposed by default)
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data/datasets
      - MODELS_DIR=/data/models
      - RESULTS_DIR=/data/results
      - ENVIRONMENT=production
      - ALLOW_PUBLIC_REGISTER=true
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data/datasets
      - MODELS_DIR=/data/models
      - RESULTS_DIR=/data/results
      - ENVIRONMENT=production
      - ALLOW_PUBLIC_REGISTER=true
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Nginx serving Vite production build) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Named volume keeps training data / models / DB between container recreations
  data:
